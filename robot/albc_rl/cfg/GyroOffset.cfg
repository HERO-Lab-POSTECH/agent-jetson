#!/usr/bin/env python
PACKAGE = "albc_rl"
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
# imu mounting yaw offset (deg), live-tunable. 102.0 CONFIRMED 2026-08-12, replacing
# -78.0 (2026-08-11), which was itself 180 deg out because its raised-side labels came
# from tilt_azimuth.py's inverted high_side_deg column; before both, 45.0.
# Rationale in albc_control/config/albc_controller.yaml next to the same value.
gen.add("imu_yaw_offset_deg", double_t, 0,
        "IMU mounting yaw offset (deg) applied by rotate_imu/rotate_gyro",
        102.0, -180.0, 180.0)

# --- policy setpoint (obs 0:3), live-tunable from rqt_reconfigure ------------
# Same three numbers the /albc/rl_command topic carries. TWO WRITERS, ONE VALUE:
# whichever arrives last wins, and both log. That is deliberate -- a precedence
# rule nobody can see is how this repo grew its constant-drift habit. Driving
# from a script: use the topic. Turning a knob by hand: use these.
# Attitudes are DEGREES here (a slider in radians is unreadable) and converted on
# receipt; yaw rate stays rad/s because that is the gyro's own unit.
# Ranges: +-30 deg is the attitude envelope the episodes sample, and +-1.0 rad/s
# brackets the yaw rates measured in the 2026-08-12 tank channel probes.
gen.add("cmd_roll_deg", double_t, 0,
        "target roll (deg), policy obs[0]. 0 = level", 0.0, -30.0, 30.0)
gen.add("cmd_pitch_deg", double_t, 0,
        "target pitch (deg), policy obs[1]. 0 = level", 0.0, -30.0, 30.0)
gen.add("cmd_yaw_rate", double_t, 0,
        "target yaw rate (rad/s), policy obs[2]. 0 = hold heading", 0.0, -1.0, 1.0)

exit(gen.generate(PACKAGE, "rl_inference_node", "GyroOffset"))
