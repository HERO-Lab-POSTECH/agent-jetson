# albc_controller node parameters
# All values match original hardcoded defaults

# TD controller gains (base values, before gain_mult scaling)
# Kd_td removed (TDC D-term dropped in df46b09, unused); see git history to restore.
td_control:
  M_td: 0.004
  Kp_td: 0.04

# PID controller gains (base values)
pid_roll:
  kp: 0.05
  ki: 0.001
  kd: 0.0005

pid_pitch:
  kp: 0.05
  ki: 0.001
  kd: 0.0005

# Gain multiplier
gain_mult: 3.0

# IMU mounting yaw offset (degrees, FRD convention).
# MEASURED 2026-08-11: -78.0, not the long-standing 45.0 (a 122.9 deg error).
# Four hand-held tilts (12/3/6/9 o'clock, gripper at 12) solved numerically against
# the sim body frame give -77.93 +- 4.8 deg. The sim frame is pinned by three
# independent facts: agent.urdf puts the gripper at +y (0, 0.0881, -0.185); the
# vertical thrusters sit on +-x (Mx=0, My=+-0.145) and physically at 3/9 o'clock;
# the Fy=+0.707 pair (T1,T3) is the 10.5/1.5 o'clock pair that pushes toward 12.
# So +x = 3 o'clock, +y = 12 o'clock, and at 45.0 the policy was fed roll/pitch
# rotated 123 deg -- pitch arriving mostly as roll.
#
# CORRECTED 2026-08-12: +102.0, not -78.0. The 2026-08-11 solve above was right
# about the 123 deg error and wrong by a further 180 deg, because its raised-side
# labels came from tilt_azimuth.py's high_side_deg column, which is inverted
# (azimuth_deg already points at the raised side; the +180 there flips it). Three
# independent lines fix it at +102.0: the 0d live dry test (3 o'clock down now
# reads pitch +40.8 where -78.0 read -44.0, and the arm drives to the low side --
# all four directions checked); the same 2026-08-11 tilts re-scored against the
# IMU-independent J1 zero (theta1=0 lands at +0.44 deg = +x FRONT, vs -179.6 deg
# at -78.0); and the inverted-column mechanism itself, which predicts exactly the
# 180 deg gap observed. rotate_imu spins (roll, pitch) as a 2-vector, so +180 deg
# negates both components and leaves yaw and GYRO_Z untouched.
imu_yaw_offset: 102.0

# Inverse kinematics
ik:
  num_iterations: 3000
  learning_rate: 0.02
  lambda_base: 0.15

# Loop rate
loop_rate_hz: 50

# Initial joint angles (degrees) -- FALLBACK ONLY since 2026-08-24.
# The controller now seeds theta1/theta2 from the MEASURED arm state on
# /albc/joint_states, so the first command equals the present position and the
# first-tick jump is zero by construction. These constants are used only when no
# joint_states message arrives inside seed_timeout_s (i.e. the driver is not
# running -- the start_tdc_dryrun.sh bench path, where the sweep needs them).
# Do NOT treat them as the start pose: 90.0 against the ~180 deg parked pose was
# a 90 deg J2 jump into the pose that broke arm1 on 2026-08-22.
initial_theta1_deg: 90.0
initial_theta2_deg: 90.0

# How long to wait for /albc/joint_states before falling back to the constants
# above. joint_angle_command publishes at ~10 Hz and launch_albc.sh starts it
# first, so 3 s is ~30 missed cycles of margin.
seed_timeout_s: 3.0

# Refuse to start when the seeded pose puts the end effector inside the folded
# singularity. L1 == L2 == 0.233, so the EE radius is 2*L1*|cos(theta2/2)| and
# is 0 at theta2 = pi -- the parked pose, where the DLS step is pure damping and
# the command freezes (bench 2026-08-24: seed 180 deg held bit-identical for
# 10 s with a 1.19 deg roll error standing). 0.05 sits just inside the
# damping-dominance point (~0.068 m, theta2 ~ 163 deg); the bench points
# bracket it at 0.0161 frozen / 0.1252 responding. Set to 0 to disable.
min_ee_radius_m: 0.05

# Allow falling back to initial_theta{1,2}_deg when /albc/joint_states does not
# arrive. FALSE on the robot, and that is the point: a silent joint_states is a
# MEASURED failure mode here (Dynamixel bus read failure, 2026-08-24), so a
# constant fallback would turn a dead sensor path into a blind arm command.
# start_tdc_dryrun.sh passes _allow_yaml_seed:=true because it runs with no
# driver by design and its outputs are remapped to dummy topics.
allow_yaml_seed: false

# Control mode (1=TDC, 2=PID, 3=Fixed, 4=Manual)
control_mode: 1

# Manual mode defaults
manual:
  theta1: 90.0
  theta2: 90.0
  x: 0.0
  y: 0.0

