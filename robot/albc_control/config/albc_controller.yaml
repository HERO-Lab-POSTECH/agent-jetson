# albc_controller node parameters
# All values match original hardcoded defaults

# TD controller gains (base values, before gain_mult scaling)
# Kd_td removed (TDC D-term dropped in df46b09, unused); see git history to restore.
td_control:
  M_td: 0.004
  Kp_td: 0.04

# PID controller gains (base values)
pid_roll:
  kp: 0.05
  ki: 0.001
  kd: 0.0005

pid_pitch:
  kp: 0.05
  ki: 0.001
  kd: 0.0005

# Gain multiplier
gain_mult: 3.0

# IMU mounting yaw offset (degrees, FRD convention).
# MEASURED 2026-08-11: -78.0, not the long-standing 45.0 (a 122.9 deg error).
# Four hand-held tilts (12/3/6/9 o'clock, gripper at 12) solved numerically against
# the sim body frame give -77.93 +- 4.8 deg. The sim frame is pinned by three
# independent facts: agent.urdf puts the gripper at +y (0, 0.0881, -0.185); the
# vertical thrusters sit on +-x (Mx=0, My=+-0.145) and physically at 3/9 o'clock;
# the Fy=+0.707 pair (T1,T3) is the 10.5/1.5 o'clock pair that pushes toward 12.
# So +x = 3 o'clock, +y = 12 o'clock, and at 45.0 the policy was fed roll/pitch
# rotated 123 deg -- pitch arriving mostly as roll.
#
# CORRECTED 2026-08-12: +102.0, not -78.0. The 2026-08-11 solve above was right
# about the 123 deg error and wrong by a further 180 deg, because its raised-side
# labels came from tilt_azimuth.py's high_side_deg column, which is inverted
# (azimuth_deg already points at the raised side; the +180 there flips it). Three
# independent lines fix it at +102.0: the 0d live dry test (3 o'clock down now
# reads pitch +40.8 where -78.0 read -44.0, and the arm drives to the low side --
# all four directions checked); the same 2026-08-11 tilts re-scored against the
# IMU-independent J1 zero (theta1=0 lands at +0.44 deg = +x FRONT, vs -179.6 deg
# at -78.0); and the inverted-column mechanism itself, which predicts exactly the
# 180 deg gap observed. rotate_imu spins (roll, pitch) as a 2-vector, so +180 deg
# negates both components and leaves yaw and GYRO_Z untouched.
imu_yaw_offset: 102.0

# Inverse kinematics
ik:
  num_iterations: 3000
  learning_rate: 0.02
  lambda_base: 0.15

# Loop rate
loop_rate_hz: 50

# Initial joint angles (degrees)
initial_theta1_deg: 90.0
initial_theta2_deg: 90.0

# Control mode (1=TDC, 2=PID, 3=Fixed, 4=Manual)
control_mode: 1

# Manual mode defaults
manual:
  theta1: 90.0
  theta2: 90.0
  x: 0.0
  y: 0.0

